<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf5ec" />
    <meta name="description" content="Μάθε κάτι ουσιαστικό κάθε μέρα. Anti-doom-scroll γνώση." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MindFeed" />
    <title>MindFeed</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Prevent flash-of-wrong-theme: apply stored preference before React loads
      (function() {
        var t = localStorage.getItem('mf_theme');
        var resolved = (t === 'light' || t === 'dark')
          ? t
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', resolved);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
