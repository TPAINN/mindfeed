<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="MindFeed — Anti-doom-scroll. Science-backed knowledge cards, one calm feed a day.">
<title>MindFeed</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0a1f"/><stop offset="1" stop-color="#08131c"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="clip"><rect width="1280" height="360" rx="22"/></clipPath>
<style>
.bar{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.4s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.3);opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 4s ease-out infinite}
@keyframes rg{0%{transform:scale(.75);opacity:.6}100%{transform:scale(1.15);opacity:0}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.glow{filter:drop-shadow(0 0 8px #a78bfa)}
.blink{animation:bk 1.1s steps(2,start) infinite}
@keyframes bk{to{opacity:0}}
.sweep{animation:sw 3.4s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translateY(0)}50%{transform:translateY(272px)}}
.cell{animation:ce 3.2s ease-in-out infinite}
@keyframes ce{0%,100%{opacity:.25}50%{opacity:1}}
.scramble{animation:sc 3s ease-in-out infinite}
@keyframes sc{0%,100%{opacity:.15}30%,70%{opacity:1}}
.seg{transform-box:fill-box;transform-origin:left;animation:sg 3s ease-in-out infinite}
@keyframes sg{0%,100%{transform:scaleX(.2);opacity:.4}50%{transform:scaleX(1);opacity:1}}
.flip{transform-box:fill-box;transform-origin:center;animation:fp 5s ease-in-out infinite}
@keyframes fp{0%,40%,100%{transform:scaleX(1)}50%{transform:scaleX(.05)}60%,90%{transform:scaleX(1)}}
.ringbell{transform-box:fill-box;transform-origin:50% 8%;animation:rb 2.4s ease-in-out infinite}
@keyframes rb{0%,100%{transform:rotate(0)}15%{transform:rotate(9deg)}30%{transform:rotate(-9deg)}45%{transform:rotate(5deg)}60%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="360" fill="url(#bg)"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<circle cx="260" cy="40" r="260" fill="url(#orb)"><animate attributeName="cx" values="260;340;260" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="340" r="300" fill="url(#orb2)"><animate attributeName="cy" values="340;290;340" dur="11s" repeatCount="indefinite"/></circle>
<line x1="1130" y1="90" x2="1190" y2="170" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.5"/><line x1="1190" y1="170" x2="1120" y2="250" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.5"/><line x1="1130" y1="90" x2="1040" y2="120" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.5"/><line x1="1040" y1="120" x2="1060" y2="230" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.5"/><line x1="1060" y1="230" x2="1120" y2="250" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.5"/><line x1="1040" y1="120" x2="1190" y2="170" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.5"/><circle class="pulse" cx="1130" cy="90" r="7" fill="#a78bfa" style="animation-delay:-0s"/><circle class="pulse" cx="1190" cy="170" r="7" fill="#22d3ee" style="animation-delay:-0.5s"/><circle class="pulse" cx="1120" cy="250" r="7" fill="#a78bfa" style="animation-delay:-1s"/><circle class="pulse" cx="1040" cy="120" r="7" fill="#22d3ee" style="animation-delay:-1.5s"/><circle class="pulse" cx="1060" cy="230" r="7" fill="#a78bfa" style="animation-delay:-2s"/><g class="float"><g transform="rotate(-9 900 190)" opacity="0.35"><rect x="790" y="110" width="220" height="160" rx="18" fill="#12101f" stroke="url(#g1)" stroke-opacity=".6"/><rect x="810" y="136" width="90" height="10" rx="5" fill="#a78bfa"/><rect x="810" y="168" width="170" height="8" rx="4" fill="#fff" opacity=".22"/><rect x="810" y="188" width="150" height="8" rx="4" fill="#fff" opacity=".16"/><rect x="810" y="208" width="120" height="8" rx="4" fill="#fff" opacity=".12"/><rect x="810" y="236" width="54" height="18" rx="9" fill="#22d3ee" opacity=".35"/></g><g transform="rotate(-3 940 170)" opacity="0.6"><rect x="830" y="90" width="220" height="160" rx="18" fill="#12101f" stroke="url(#g1)" stroke-opacity=".6"/><rect x="850" y="116" width="90" height="10" rx="5" fill="#a78bfa"/><rect x="850" y="148" width="170" height="8" rx="4" fill="#fff" opacity=".22"/><rect x="850" y="168" width="150" height="8" rx="4" fill="#fff" opacity=".16"/><rect x="850" y="188" width="120" height="8" rx="4" fill="#fff" opacity=".12"/><rect x="850" y="216" width="54" height="18" rx="9" fill="#22d3ee" opacity=".35"/></g><g transform="rotate(4 980 150)" opacity="1"><rect x="870" y="70" width="220" height="160" rx="18" fill="#12101f" stroke="url(#g1)" stroke-opacity=".6"/><rect x="890" y="96" width="90" height="10" rx="5" fill="#a78bfa"/><rect x="890" y="128" width="170" height="8" rx="4" fill="#fff" opacity=".22"/><rect x="890" y="148" width="150" height="8" rx="4" fill="#fff" opacity=".16"/><rect x="890" y="168" width="120" height="8" rx="4" fill="#fff" opacity=".12"/><rect x="890" y="196" width="54" height="18" rx="9" fill="#22d3ee" opacity=".35"/></g></g>
<text x="72" y="140" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#tt)">MindFeed</text>
<text x="72" y="200" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">Anti-doom-scroll. Science-backed knowledge cards,</text><text x="72" y="232" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">one calm feed a day.</text>
<g transform="translate(72 292)"><rect width="76" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#a78bfa" stroke-opacity=".45"/><text x="38" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">React</text></g><g transform="translate(158 292)"><rect width="67" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#a78bfa" stroke-opacity=".45"/><text x="33" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">Node</text></g><g transform="translate(235 292)"><rect width="94" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#a78bfa" stroke-opacity=".45"/><text x="47" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">MongoDB</text></g><g transform="translate(339 292)"><rect width="113" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#a78bfa" stroke-opacity=".45"/><text x="56" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">Claude AI</text></g>
<rect x="1" y="1" width="1278" height="358" rx="21" fill="none" stroke="url(#g1)" stroke-opacity=".35" stroke-width="1.5"/>
</g>
</svg>
